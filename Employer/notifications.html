<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employer Notifications | HireNova AI</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/app-overrides.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><i class="fa-solid fa-building"></i><h2>HireNova AI</h2></div>
    <p style="font-size:11px;color:#94a3b8;padding:0 12px 16px;">Employer Console</p>
    <ul>
      <li><a href="dashboard.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-house"></i><span>Dashboard</span></a></li>
      <li><a href="post_job.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-circle-plus"></i><span>Post a Job</span></a></li>
      <li><a href="manage_jobs.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-briefcase"></i><span>Manage Jobs</span></a></li>
      <li><a href="applicants.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-users"></i><span>Applicants</span></a></li>
      <li><a href="candidate_ranking.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-ranking-star"></i><span>Candidate Ranking</span></a></li>
      <li class="active"><a href="notifications.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-bell"></i><span>Notifications</span></a></li>
      <li><a href="company_profile.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-building"></i><span>Company Profile</span></a></li>
      <li><a href="settings.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-gear"></i><span>Settings</span></a></li>
      <li><a href="../login.html" onclick="return window.hirenovaLogout ? (window.hirenovaLogout(event), false) : true" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a></li>
    </ul>
  </aside>
  <main class="main">
    <nav class="navbar"><div class="nav-left"><h2>Employer Notifications</h2><p>New applicants, interviews and match alerts</p></div><div class="nav-right"><button class="btn btn-outline btn-sm" id="markAllBtn" type="button">Mark all read</button></div></nav>
    <div class="page">
      <div class="card" style="max-width:820px;">
        <div id="notifList"><p style="color:var(--text-500);">Loading notifications…</p></div>
      </div>
    </div>
  </main>
</div>
<script src="../js/layout.js"></script>
<script src="../js/api.js"></script>
<script src="../js/live.js"></script>
<script>
(function () {
  var list = document.getElementById('notifList');
  function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
  function render(items){
    if (!items || !items.length) { list.innerHTML = '<p style="color:var(--text-500);">No notifications yet.</p>'; return; }
    list.innerHTML = items.map(function(n){
      return '<div style="padding:14px 0;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start;'+(n.is_read?'opacity:.72;':'')+'">'
        + '<i class="fa-solid fa-bell" style="color:var(--primary);margin-top:2px;"></i>'
        + '<div style="flex:1;"><strong>' + esc(n.title) + '</strong><div style="font-size:13px;color:var(--text-500);margin-top:4px;">' + esc(n.body||'') + '</div></div>'
        + (!n.is_read ? '<button class="btn btn-sm btn-outline" data-read="'+n.id+'">Mark read</button>' : '')
        + '</div>';
    }).join('');
    list.querySelectorAll('[data-read]').forEach(function(btn){
      btn.addEventListener('click', function(){ window.hirenovaApi.markNotificationRead(btn.getAttribute('data-read')).then(load).catch(function(e){ window.toast && window.toast((e&&e.message)||'Failed'); }); });
    });
  }
  function load(){
    if (!window.hirenovaApi || !window.hirenovaApi.hasToken()) { list.innerHTML = '<p style="color:var(--text-500);">Please <a href="../login.html">sign in</a> to view notifications.</p>'; return; }
    window.hirenovaApi.notifications().then(function(d){ render((d&&d.notifications)||[]); }).catch(function(e){ list.innerHTML = '<p style="color:var(--danger,#b91c1c);">Could not load notifications.</p>'; });
  }
  document.getElementById('markAllBtn').addEventListener('click', function(){
    if (!window.hirenovaApi || !window.hirenovaApi.hasToken()) return;
    window.hirenovaApi.markAllNotificationsRead().then(load).catch(function(e){ window.toast && window.toast((e&&e.message)||'Failed'); });
  });
  load();
})();
</script>
</body>
</html>
