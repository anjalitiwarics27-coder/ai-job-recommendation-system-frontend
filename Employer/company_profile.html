<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Profile | HireNova AI</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/app-overrides.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><i class="fa-solid fa-building"></i><h2>HireNova AI</h2></div>
    <p style="font-size:11px;color:#94a3b8;padding:0 12px 16px;">Employer Console</p>
    <ul>
      <li><a href="dashboard.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-house"></i><span>Dashboard</span></a></li>
      <li><a href="post_job.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-circle-plus"></i><span>Post a Job</span></a></li>
      <li><a href="manage_jobs.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-briefcase"></i><span>Manage Jobs</span></a></li>
      <li><a href="applicants.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-users"></i><span>Applicants</span></a></li>
      <li><a href="candidate_ranking.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-ranking-star"></i><span>Candidate Ranking</span></a></li>
      <li><a href="notifications.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-bell"></i><span>Notifications</span></a></li>
      <li class="active"><a href="company_profile.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-building"></i><span>Company Profile</span></a></li>
      <li><a href="settings.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-gear"></i><span>Settings</span></a></li>
      <li><a href="../login.html" onclick="return window.hirenovaLogout ? (window.hirenovaLogout(event), false) : true" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a></li>
    </ul>
  </aside>
  <main class="main">
    <nav class="navbar"><div class="nav-left"><h2>Company Profile</h2><p>Build a compelling employer brand page</p></div><div class="nav-right"><a href="dashboard.html" class="btn btn-outline btn-sm">Back to Dashboard</a></div></nav>
    <div class="page">
      <div class="card" style="max-width:720px;">
        <form id="companyProfileForm">
          <div class="field"><label for="company_name">Company name</label><input id="company_name" placeholder="Your company name"></div>
          <div class="field"><label for="headline">Tagline / Headline</label><input id="headline" placeholder="e.g. Building the future of hiring"></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
            <div class="field"><label for="location">Location</label><input id="location" placeholder="City, Country"></div>
            <div class="field"><label for="phone">Contact phone</label><input id="phone" placeholder="+91 ..."></div>
          </div>
          <div class="field"><label for="bio">About company</label><textarea id="bio" rows="6" placeholder="Tell candidates about your mission, culture, and what you build."></textarea></div>
          <button type="submit" class="btn btn-primary">Save Profile</button>
          <span id="profileStatus" style="margin-left:10px;font-size:13px;color:var(--text-500);"></span>
        </form>
      </div>
    </div>
  </main>
</div>
<script src="../js/layout.js"></script>
<script src="../js/api.js"></script>
<script src="../js/live.js"></script>
<script>
(function () {
  var form = document.getElementById('companyProfileForm');
  var status = document.getElementById('profileStatus');
  function setStatus(msg) { if (status) status.textContent = msg || ''; }
  function fill(p) {
    if (!p) return;
    ['company_name','headline','location','phone','bio'].forEach(function (k) { var el = document.getElementById(k); if (el && p[k] != null) el.value = p[k]; });
  }
  if (window.hirenovaApi && window.hirenovaApi.hasToken()) {
    window.hirenovaApi.employerProfile().then(function (d) { fill(d && d.profile); }).catch(function () {});
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!window.hirenovaApi || !window.hirenovaApi.hasToken()) { window.hirenovaLogout && window.hirenovaLogout(); return; }
    var payload = { company_name: document.getElementById('company_name').value, headline: document.getElementById('headline').value, location: document.getElementById('location').value, phone: document.getElementById('phone').value, bio: document.getElementById('bio').value };
    setStatus('Saving…');
    window.hirenovaApi.updateEmployerProfile(payload).then(function (d) {
      fill(d && d.profile);
      setStatus('Saved');
      window.toast && window.toast('Company profile updated');
    }).catch(function (err) { setStatus((err && err.message) || 'Could not save'); window.toast && window.toast((err && err.message) || 'Could not save'); });
  });
})();
</script>
</body>
</html>
