<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics | HireNova AI</title>
<link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/layout.css"><link rel="stylesheet" href="../css/dashboard.css"><link rel="stylesheet" href="../css/app-overrides.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><i class="fa-solid fa-shield-halved"></i><h2>HireNova AI</h2></div>
    <p style="font-size:11px;color:#94a3b8;padding:0 12px 16px;">Admin Console</p>
    <ul>
      <li><a href="dashboard.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-house"></i><span>Dashboard</span></a></li>
      <li><a href="users.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-users"></i><span>Users</span></a></li>
      <li><a href="jobs.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-briefcase"></i><span>Jobs</span></a></li>
      <li class="active"><a href="analytics.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-chart-line"></i><span>Analytics</span></a></li>
      <li><a href="ai_settings.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-robot"></i><span>AI Settings</span></a></li>
      <li><a href="audit_logs.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-clipboard-list"></i><span>Audit Logs</span></a></li>
      <li><a href="settings.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-gear"></i><span>Settings</span></a></li>
      <li><a href="../login.html" onclick="return window.hirenovaLogout ? (window.hirenovaLogout(event), false) : true" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a></li>
    </ul>
  </aside>
  <main class="main">
    <nav class="navbar"><div class="nav-left"><h2>Analytics</h2><p>Platform funnel, match quality and activity signals</p></div><div class="nav-right"><a href="dashboard.html" class="btn btn-outline btn-sm">Back to Dashboard</a></div></nav>
    <div class="page">
      <section class="stats" id="stats"></section>
      <div class="card" style="margin-top:16px;"><h3>Applications by status</h3><div id="byStatus" style="margin-top:12px;"></div></div>
      <div class="card" style="margin-top:16px;"><h3>Jobs by category</h3><div id="byCat" style="margin-top:12px;"></div></div>
    </div>
  </main>
</div>
<script src="../js/layout.js"></script><script src="../js/api.js"></script>
<script>
(function(){
  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
  function kv(obj){ obj=obj||{}; var k=Object.keys(obj); if(!k.length) return '<p style="color:var(--text-500)">No data yet.</p>'; return '<ul style="margin:0;padding-left:18px;">'+k.map(function(key){return '<li><strong>'+esc(key)+':</strong> '+esc(obj[key])+'</li>';}).join('')+'</ul>'; }
  if(!window.hirenovaApi||!window.hirenovaApi.hasToken()) return;
  window.hirenovaApi.adminAnalytics().then(function(d){
    var t=(d&&d.totals)||{};
    document.getElementById('stats').innerHTML =
      '<div class="stat-card"><i class="fa-solid fa-users"></i><h2>'+esc(t.users||0)+'</h2><p>Total Users</p></div>'+
      '<div class="stat-card"><i class="fa-solid fa-briefcase"></i><h2>'+esc(t.jobs||0)+'</h2><p>Jobs</p></div>'+
      '<div class="stat-card"><i class="fa-solid fa-file-lines"></i><h2>'+esc(t.applications||0)+'</h2><p>Applications</p></div>';
    document.getElementById('byStatus').innerHTML = kv(d&&d.applications_by_status);
    document.getElementById('byCat').innerHTML = kv(d&&d.jobs_by_category);
  }).catch(function(e){ window.toast&&window.toast(e.message||'Failed to load analytics'); });
})();
</script>
</body></html>
