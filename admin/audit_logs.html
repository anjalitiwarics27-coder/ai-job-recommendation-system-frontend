<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Logs | HireNova AI</title>
<link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/layout.css"><link rel="stylesheet" href="../css/dashboard.css"><link rel="stylesheet" href="../css/app-overrides.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><i class="fa-solid fa-shield-halved"></i><h2>HireNova AI</h2></div>
    <p style="font-size:11px;color:#94a3b8;padding:0 12px 16px;">Admin Console</p>
    <ul>
      <li><a href="dashboard.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-house"></i><span>Dashboard</span></a></li>
      <li><a href="users.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-users"></i><span>Users</span></a></li>
      <li><a href="jobs.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-briefcase"></i><span>Jobs</span></a></li>
      <li><a href="analytics.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-chart-line"></i><span>Analytics</span></a></li>
      <li><a href="ai_settings.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-robot"></i><span>AI Settings</span></a></li>
      <li class="active"><a href="audit_logs.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-clipboard-list"></i><span>Audit Logs</span></a></li>
      <li><a href="settings.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-gear"></i><span>Settings</span></a></li>
      <li><a href="../login.html" onclick="return window.hirenovaLogout ? (window.hirenovaLogout(event), false) : true" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:15px;width:100%;"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a></li>
    </ul>
  </aside>
  <main class="main">
    <nav class="navbar"><div class="nav-left"><h2>Audit Logs</h2><p>Who did what, and when</p></div><div class="nav-right"><a href="dashboard.html" class="btn btn-outline btn-sm">Back to Dashboard</a></div></nav>
    <div class="page"><div class="card"><div id="logWrap">Loading audit logs…</div></div></div>
  </main>
</div>
<script src="../js/layout.js"></script><script src="../js/api.js"></script>
<script>
(function(){
  var wrap=document.getElementById('logWrap');
  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
  if(!window.hirenovaApi||!window.hirenovaApi.hasToken()){wrap.innerHTML='<p>Please sign in as admin.</p>';return;}
  window.hirenovaApi.adminAudit('?per_page=50').then(function(d){
    var logs=(d&&d.logs)||[];
    if(!logs.length){wrap.innerHTML='<p style="color:var(--text-500)">No audit logs yet.</p>';return;}
    wrap.innerHTML='<div class="table-wrap"><table class="data"><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Detail</th></tr></thead><tbody>'+
      logs.map(function(l){return '<tr><td>'+esc(l.created_at||'')+'</td><td>'+esc(l.actor_id!=null?('#'+l.actor_id):'—')+'</td><td>'+esc(l.action)+'</td><td>'+esc(l.detail||'')+'</td></tr>';}).join('')+
      '</tbody></table></div>';
  }).catch(function(e){wrap.innerHTML='<p>'+(e.message||'Failed to load audit logs')+'</p>';});
})();
</script>
</body></html>
